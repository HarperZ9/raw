; d3d11_proxy.ini: goes next to SkyrimSE.exe with the proxy d3d11.dll.

[General]
SafeMode=0

[D3D12Bridge]
; RAW's own D3D12 device beside the game's D3D11 device (stage 1).
Enabled=1
; 0 identity, 1 depth haze, 2 linear-depth view
Mode=1
Density=0.00012
FogR=0.55
FogG=0.62
FogB=0.80
MaxOpacity=0.85
Near=15
Far=353840
; four swatches top-left that rotate each frame: proof the D3D12 pass ran
Marker=1
FallbackAtPresent=1
DebugLayer=0
TimingLogEvery=300
; frame after which the backbuffer is written to d3d12_bridge_capture.bmp (0 = never)
CaptureFrame=0
; Pass=engine runs the Playground engine's GTAO (a build with RAW_ENGINE_DIR). Its defaults are
; a reference-grade 16 slices by 16 steps; 4 by 8 is the setting measured in game.
;Pass=engine
;AoRadius=35
;AoSlices=4
;AoSteps=8
; AoMode=realtime runs the engine's real-time AO instead: half-resolution trace, blue noise,
; accumulation along the game's motion vectors (docs/D3D12_BRIDGE.md, "Real-time AO").
; With it, AoSlices and AoSteps default to 2 and 16.
;AoMode=realtime
;AoHistory=32
; Pass=lighting: the engine lights the frame itself at the end of the opaque pass, in place of the
; game's lighting, before water, effects, fog, tone map and the HUD (docs/LIGHTING.md). Needs
; [GBuffer] Enabled=1 and a build with RAW_ENGINE_DIR. Keys in [Lighting] below.
;Pass=lighting

[GBuffer]
; The game's own shaders write albedo, specular, gloss, emissive, a material class and a layer for
; water and blended surfaces into targets RAW owns (docs/FRAME_BUFFERS.md, "Shader patches").
Enabled=0

[Lighting]
; Read with Pass=lighting. Mode 0 keeps the game's lighting, 1 is ours matched to the game,
; 2 is ours with the improvements on. F10 cycles the three in game.
Mode=1
; The improvements (Mode=2), each with its own switch for a before and after.
SoftShadows=1
GgxSpecular=1
VolumetricFog=1
ContactShadows=1
Ao=1
; 1: the sun's shadow from the decoded cascades. 0: the game's own shadow mask.
Cascades=1
; one cascade's side, the game's iShadowMapResolution
ShadowMapSize=4096
;FogDensity=0.00006
;AoStrength=0.7
; CaptureAfter=N: after N world frames, step through game, match and every improvement, Hold
; frames each, writing the backbuffer and the match statistics to CaptureDir.
;CaptureAfter=4200
;Hold=40
;CaptureDir=D:\capture
;Scene=riverwood_day

[FrameLedger]
; One-frame inventory of every buffer the game writes (docs/FRAME_BUFFERS.md). Off by default.
Enabled=0
;OutDir=D:\capture
;AfterGameplayFrames=260
;History=1   ; 2 keeps only the HDR colour after every span (enough for the coverage report)
